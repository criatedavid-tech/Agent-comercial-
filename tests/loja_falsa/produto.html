<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Controle DualSense Branco | Loja Falsa</title>
<style>
  body { font-family: sans-serif; margin: 0; }
  #menu a { margin-right: 4px; font-size: 11px; }
  #buybox { margin: 40px; padding: 20px; border: 1px solid #ccc; width: 320px; }
  /* barra fixa que fica por cima do botão de adicionar (como avisos e barras da Amazon) */
  #barra { position: fixed; left: 0; right: 0; bottom: 0; height: 140px; background: rgba(255,255,255,.01); z-index: 10; }
  #espaco { height: 1600px; }
</style></head>
<body>
<div id="menu"></div>
<h1>Controle sem fio DualSense - Branco</h1>
<div id="espaco"></div>
<div id="buybox">
  <p>R$ 376,20 · Vendido e entregue por Loja Falsa</p>
  <label>Quantidade <select id="quantidade"><option>1</option><option>2</option></select></label>
  <button id="add-to-cart-button" onclick="adicionar()">Adicionar ao carrinho</button>
  <button id="buy-now-button" onclick="location.href='revisao.html?agora=1'">Comprar agora</button>
</div>
<div id="barra"></div>
<!-- como a Amazon: depois de adicionar, aparecem recomendações com botões de mesmo nome -->
<div id="adicionado" style="display:none; margin: 40px;">
  <h2>Adicionado ao carrinho</h2>
  <a href="carrinho.html">Ir para o carrinho</a>
  <h3>Frequentemente comprados juntos</h3>
  <div class="rec"><p>PlayStation 5 Slim Digital 825GB – Pacote ASTRO BOT</p><p>R$ 3.783,12</p>
    <button onclick="adicionarItem('ps5', 'PlayStation 5 Slim Digital', 3783.12)">Adicionar ao carrinho</button></div>
  <div class="rec"><p>Base De Carregamento Do Dualsense</p><p>R$ 169,00</p>
    <button onclick="adicionarItem('base', 'Base De Carregamento', 169.00)">Adicionar ao carrinho</button></div>
</div>
<script>
  const menu = document.getElementById('menu');
  for (let i = 1; i <= 250; i++) { const a = document.createElement('a'); a.href = '#cat' + i; a.textContent = 'Categoria ' + i; menu.appendChild(a); }
  function adicionarItem(id, titulo, preco) {
    const cart = JSON.parse(localStorage.getItem('carrinho') || 'null') || inicial();
    cart.push({id, titulo, preco, marcado: true});
    localStorage.setItem('carrinho', JSON.stringify(cart));
  }
  function adicionar() {
    adicionarItem('dualsense', 'Controle DualSense Branco', 376.20);
    document.getElementById('buybox').style.display = 'none';
    document.getElementById('espaco').style.display = 'none';
    document.getElementById('adicionado').style.display = 'block';
  }
  // o carrinho da conta já tem itens que o usuário guardou e não pediu agora
  function inicial() {
    return [
      {id: 'headset', titulo: 'Headset Gamer Havit H2232d', preco: 94.06, marcado: true},
      {id: 'odisseia', titulo: 'Odisseia - Homero', preco: 93.37, marcado: true},
    ];
  }
</script>
</body></html>
