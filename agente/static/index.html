<!doctype html>
<html lang="pt-BR">
<head>
<script>try { if (localStorage.getItem("tema") === "claro") document.documentElement.dataset.theme = "light"; } catch {}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agente pessoal</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #9a9993;
    --border: #33332f; --accent: #5fae84; --accent-text: #0f1a14;
    --user: #22312a; --tool: #262623; --error: #f2b8b5; --warn-bg: #3a3220;
  }
  :root[data-theme="light"] {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #75746f;
    --border: #e4e3de; --accent: #2f6f4f; --accent-text: #ffffff;
    --user: #e8f1ec; --tool: #f1f0eb; --error: #b3261e; --warn-bg: #fff4d6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #meta { color: var(--muted); font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  #dot.on { background: var(--accent); }
  button {
    font: inherit; border: 1px solid var(--border); background: var(--panel); color: var(--text);
    border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  #warn { display: none; background: var(--warn-bg); padding: 10px 16px; font-size: 14px; border-bottom: 1px solid var(--border); }
  main { flex: 1; overflow-y: auto; }
  #log { max-width: 820px; margin: 0 auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { padding: 10px 14px; border-radius: 10px; overflow-wrap: anywhere; }
  .msg.user { background: var(--user); align-self: flex-end; max-width: 85%; white-space: pre-wrap; }
  .msg.text { background: var(--panel); border: 1px solid var(--border); }
  .msg.text :first-child { margin-top: 0; } .msg.text :last-child { margin-bottom: 0; }
  .msg.text pre { background: var(--tool); padding: 10px; border-radius: 6px; overflow-x: auto; }
  .msg.tool { background: var(--tool); color: var(--muted); font: 13px/1.4 ui-monospace, Consolas, monospace; padding: 6px 10px; }
  .msg.result, .msg.ready { color: var(--muted); font-size: 13px; padding: 2px 4px; }
  .msg.error { color: var(--error); border: 1px solid var(--error); }
  .msg.blocked { color: var(--error); background: var(--tool); font: 13px/1.4 ui-monospace, Consolas, monospace; padding: 6px 10px; }
  .msg.help { background: var(--warn-bg); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  .msg.help b { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  .msg.help a { color: var(--accent); word-break: break-all; }
  .msg.help .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .msg.help input { flex: 1 1 200px; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
  .msg.help .ok { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .msg.help.done { opacity: .6; }
  .msg.proactive { background: var(--panel); border: 1px solid var(--accent); }
  .msg.proactive .head { font-size: 13px; color: var(--accent); font-weight: 600; margin-bottom: 6px; }
  .msg.proactive .body :first-child { margin-top: 0; } .msg.proactive .body :last-child { margin-bottom: 0; }
  .empty { color: var(--muted); text-align: center; margin-top: 18vh; }
  form { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 16px; }
  .row { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; max-height: 200px;
  }
  #send { background: var(--accent); color: var(--accent-text); border-color: var(--accent); padding: 10px 18px; }
  header a.btn { font-size: 15px; border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; color: var(--text); text-decoration: none; }
  .undo { display: block; margin: 6px 0 0 auto; font-size: 12px; padding: 2px 8px; color: var(--muted); }
  dialog { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); color: var(--text); padding: 0; width: min(560px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog header { border: 0; padding: 12px 16px; }
  #convlist { max-height: 60vh; overflow-y: auto; padding: 0 8px 8px; }
  #convlist button { display: block; width: 100%; text-align: left; border: 0; border-radius: 8px; padding: 8px 10px; background: none; }
  #convlist button:hover { background: var(--tool); }
  #convlist small { color: var(--muted); display: block; }
  @media (max-width: 640px) { #meta { display: none; } }
</style>
</head>
<body>
<header>
  <span id="dot" title="conexão"></span>
  <h1>Agente pessoal</h1>
  <span id="meta">conectando…</span>
  <button id="tema" type="button" title="Alternar tema claro/escuro">☀ Claro</button>
  <button id="convs" type="button">Conversas</button>
  <a class="btn" href="/painel">Painel</a>
  <button id="reset" type="button" disabled>Nova conversa</button>
</header>
<dialog id="convdialog">
  <header><h1>Conversas anteriores</h1><span style="flex:1"></span><button id="convclose" type="button">Fechar</button></header>
  <div id="convlist"></div>
</dialog>
<div id="warn">A <b>ANTHROPIC_API_KEY</b> está vazia no <code>.env</code>. Preencha e reinicie o servidor; sem ela o SDK tenta o login do Claude Code.</div>
<main id="scroll"><div id="log"><p class="empty">Peça qualquer coisa. O agente usa terminal, arquivos e web sem pedir confirmação.</p></div></main>
<form id="form">
  <div class="row">
    <textarea id="input" rows="1" placeholder="Seu pedido… (Enter envia, Shift+Enter quebra linha)" disabled></textarea>
    <button id="send" type="submit" disabled>Enviar</button>
  </div>
</form>
<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("input"), send = $("send"), reset = $("reset");
let ws, busy = false, ready = false, lastUser = null;
// Conversa atual: fica na URL (?sessao=...) para sobreviver a recarregar a página e a links do painel.
let session = new URLSearchParams(location.search).get("sessao");

function setSession(id) {
  session = id;
  history.replaceState(null, "", id ? "/?sessao=" + encodeURIComponent(id) : "/");
}

// Cada pedido ganha um botão para desfazer as edições de arquivo feitas a partir dele.
function attachUndo(checkpoint) {
  if (!lastUser || lastUser.querySelector(".undo")) return;
  const b = document.createElement("button");
  b.className = "undo"; b.type = "button"; b.textContent = "↶ desfazer edições deste pedido";
  b.onclick = () => {
    if (busy || !confirm("Voltar os arquivos que o agente criou ou editou a partir deste pedido?")) return;
    ws.send(JSON.stringify({ type: "undo", checkpoint }));
    b.disabled = true; b.textContent = "edições desfeitas";
  };
  lastUser.appendChild(b);
}

function render(md) {
  if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(md));
  const div = document.createElement("div"); div.textContent = md; div.style.whiteSpace = "pre-wrap";
  return div.outerHTML;
}

// Pedido de ajuda humana: o agente pausou a tarefa e espera esta resposta.
function helpCard(el, ev) {
  el.innerHTML = '<b>O agente precisa de você</b><div class="reason"></div><div class="link"></div>' +
    '<div class="actions"><input placeholder="código, escolha ou observação (opcional)">' +
    '<button class="ok">Resolvido, continuar</button><button class="no">Não consegui</button></div>';
  el.querySelector(".reason").textContent = ev.text;
  if (/^https?:\/\//.test(ev.link || "")) {
    const a = document.createElement("a");
    a.href = ev.link; a.textContent = ev.link; a.target = "_blank"; a.rel = "noopener noreferrer";
    el.querySelector(".link").appendChild(a);
  }
  const field = el.querySelector("input");
  const reply = (text) => {
    ws.send(JSON.stringify({ type: "help_reply", id: ev.id, text }));
    el.classList.add("done");
    el.querySelectorAll("button, input").forEach(x => x.disabled = true);
    document.title = "Agente pessoal";
  };
  el.querySelector(".ok").onclick = () => reply(field.value.trim() ? "resolvido: " + field.value.trim() : "resolvido");
  el.querySelector(".no").onclick = () => reply("não consegui" + (field.value.trim() ? ": " + field.value.trim() : ""));
  field.onkeydown = (e) => { if (e.key === "Enter") el.querySelector(".ok").click(); };
  log.appendChild(el);
  $("scroll").scrollTop = $("scroll").scrollHeight;
  document.title = "⚠ Precisa de você · Agente pessoal";
  field.focus();
}

function add(kind, text, extra) {
  log.querySelector(".empty")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + kind;
  if (kind === "help") return helpCard(el, extra);
  if (kind === "checkpoint") return attachUndo(text);
  if (kind === "user") lastUser = el;
  if (kind === "proactive") {  // resultado de tarefa agendada ou lembrete
    el.innerHTML = '<div class="head"></div><div class="body"></div>';
    el.querySelector(".head").textContent = `⏰ ${extra.title} · ${extra.time}`;
    el.querySelector(".body").innerHTML = render(text);
  } else if (kind === "text") el.innerHTML = render(text);
  else el.textContent = kind === "tool" ? "⚙ " + text : kind === "blocked" ? "🛡 bloqueado: " + text : text;
  log.appendChild(el);
  $("scroll").scrollTop = $("scroll").scrollHeight;
}

function setState() {
  const can = ready && !busy;
  input.disabled = !ready; send.disabled = !can; reset.disabled = !can;
  send.textContent = busy ? "Trabalhando…" : "Enviar";
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws` + (session ? "?sessao=" + encodeURIComponent(session) : ""));
  ws.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if ("session" in ev && (ev.session || null) !== session) setSession(ev.session || null);
    if (ev.kind === "history") {  // conversa retomada: redesenha o que já foi dito
      log.innerHTML = ""; lastUser = null;
      ev.items.forEach(it => add(it.kind, it.text, it));
      return;
    }
    if (ev.kind === "ready") { ready = true; $("dot").classList.add("on"); if (ev.text) add("ready", ev.text); }
    else add(ev.kind, ev.text, ev);
    if (ev.kind === "result" || ev.kind === "error") busy = false;
    setState();
  };
  ws.onclose = () => {
    ready = false; busy = false; $("dot").classList.remove("on"); setState();
    add("error", "Conexão perdida. Tentando reconectar…");
    setTimeout(connect, 2000);
  };
}

$("form").onsubmit = (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || busy || !ready) return;
  const el = document.createElement("div"); el.className = "msg user"; el.textContent = text;
  log.querySelector(".empty")?.remove(); log.appendChild(el); lastUser = el;
  ws.send(JSON.stringify({ type: "ask", text }));
  input.value = ""; input.style.height = "auto";
  busy = true; setState();
};
input.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } };
input.oninput = () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; };
reset.onclick = () => { log.innerHTML = ""; lastUser = null; setSession(null); ready = false; setState(); ws.send(JSON.stringify({ type: "reset" })); };

$("convs").onclick = async () => {
  const list = $("convlist"); list.innerHTML = "<p style='padding:8px'>carregando…</p>";
  $("convdialog").showModal();
  const items = await fetch("/api/conversas").then(r => r.json());
  list.innerHTML = items.length ? "" : "<p style='padding:8px'>Nenhuma conversa ainda.</p>";
  for (const c of items) {
    const b = document.createElement("button"); b.type = "button";
    b.textContent = c.title || "(sem título)";
    const small = document.createElement("small");
    small.textContent = `${c.updated.replace("T", " ").slice(0, 16)} · ${c.requests} pedido(s) · US$ ${c.cost_usd.toFixed(4)}`;
    b.appendChild(small);
    b.onclick = () => {
      $("convdialog").close();
      if (busy) return;
      ready = false; setState(); setSession(c.id);
      ws.send(JSON.stringify({ type: "resume", session: c.id }));
    };
    list.appendChild(b);
  }
};
$("convclose").onclick = () => $("convdialog").close();

fetch("/api/status").then(r => r.json()).then(s => {
  $("meta").textContent = `${s.model} · teto US$ ${s.max_budget_usd.toFixed(2)} · ${s.max_turns} passos · ${s.workdir}`;
  if (!s.api_key) $("warn").style.display = "block";
});
connect();
</script>
<script>
(() => {
  const b = document.getElementById("tema"), root = document.documentElement;
  const show = () => { b.textContent = root.dataset.theme === "light" ? "🌙 Escuro" : "☀ Claro"; };
  b.onclick = () => {
    if (root.dataset.theme === "light") delete root.dataset.theme; else root.dataset.theme = "light";
    try { localStorage.setItem("tema", root.dataset.theme === "light" ? "claro" : "escuro"); } catch {}
    show();
  };
  show();
})();
</script>
</body>
</html>
