[project]
name = "agente-pessoal"
version = "0.1.0"
description = "Agente pessoal autônomo que roda numa VPS"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.174",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "tzdata>=2024.1",  # fusos horários no Windows
    "playwright>=1.45",  # navegador próprio (depois: playwright install chromium)
    "httpx>=0.27",  # WhatsApp Cloud API (e TestClient nos testes)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
agente = "agente.cli:main"
agente-web = "agente.web:main"
agente-backup = "agente.backup:main"
agente-vigia = "agente.vigia:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agente"]

[tool.setuptools.package-data]
agente = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
