# Sistemas da loja que o agente usa pelo navegador (iFood, ERP, banco, portal de nota fiscal...).
# Alguém da equipe faz o login uma vez pela tela remota do navegador (WhatsApp: NAVEGADOR); o agente segue logado.
# De hora em hora (AGENT_ACESSOS_MIN) o código confere se cada um continua logado e, se o site
# encerrar a sessão, avisa no WhatsApp com um link para entrar de novo.
# O agente aprende cada sistema (anotações e rotinas gravadas, ver docs/acessos.md): da segunda vez em diante
# ele repete o caminho que deu certo, sem navegar passo a passo.
#
# Tire o # das linhas dos sistemas que a loja usa e ajuste:
#
# [[sistema]]
# nome = "iFood (Portal do Parceiro)"
# endereco = "https://portal.ifood.com.br/"      # página inicial do portal, que só abre logado
# logado = "Sair"                                 # troque pelo nome da loja que aparece no topo, se preferir
#
# [[sistema]]
# nome = "Sistema da oficina (ERP)"
# endereco = "https://app.sistemadaoficina.com.br/painel"
# logado = "Sair"
#
# [[sistema]]
# nome = "Banco"
# endereco = "https://www.banco.com.br/empresas/inicio"
# logado = "Olá, Auto Center Rota Certa"
